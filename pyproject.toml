[project]
name = "candlegraph"
version = "0.2.0"
description = "Digital asset market data service: ingests Uniswap v3 hourly token data and serves OHLC candles over GraphQL."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "backoff>=2.2.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.30",
    "strawberry-graphql[fastapi]>=0.247.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
candlegraph = "candlegraph.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "testcontainers[postgres]>=4.8.0",
    "types-psycopg2>=2.9.21.20261008",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["candlegraph"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "N815", # mixedCase attributes: required by the public GraphQL field names
]

[tool.ruff.lint.isort]
# `alembic/` is a directory here, but the import is the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["candlegraph"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "backoff.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a throwaway PostgreSQL (docker or TEST_DATABASE_URL)",
    "e2e: needs the full stack running (CANDLEGRAPH_E2E_URL)",
]
filterwarnings = ["error::DeprecationWarning:candlegraph.*"]

[tool.coverage.run]
source = ["candlegraph"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']
