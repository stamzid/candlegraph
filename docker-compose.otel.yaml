# Tracing, opt in. Nothing here runs with a plain `make up`.
#
#   make otel-up            # the stack plus a collector, with tracing on
#   make otel-logs          # the spans, as the collector received them
#
# An overlay rather than a profile in the main file, because the two
# start-up post-mortems left `docker-compose.yaml` as the one thing that
# decides how the stack comes up, and a tracing backend is not part of that.
#
# The collector here prints spans and keeps nothing. It is enough to answer
# "what did that pipeline run actually spend its time on"; a real deployment
# points OTEL_EXPORTER_ENDPOINT at a collector that forwards to Tempo,
# Jaeger, Honeycomb or whatever it uses, and needs no change here.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otel/config.yaml"]
    configs:
      - source: otel_config
        target: /etc/otel/config.yaml
    ports:
      # OTLP over HTTP. gRPC (4317) is not exposed: the exporter this ships
      # with speaks HTTP, and one open port is enough.
      - "${BIND_HOST:-127.0.0.1}:${OTEL_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--help"]
      interval: 3m
      start_period: 20s
      start_interval: 2s
      retries: 3

  worker:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "candlegraph-worker"
    depends_on:
      otel-collector:
        condition: service_healthy

  agents:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "candlegraph-agents"
    depends_on:
      otel-collector:
        condition: service_healthy

  candlegraph:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: "http://otel-collector:4318"
      OTEL_SERVICE_NAME: "candlegraph-api"

configs:
  otel_config:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
      exporters:
        debug:
          verbosity: detailed
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
