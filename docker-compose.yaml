# Project name is intentionally left to Compose's default (the directory name)
# so several checkouts or git worktrees can run side by side. Override with
# COMPOSE_PROJECT_NAME, and the published ports below, if you need two at once.
#
# Five services: the database, the API, the ingest worker, the UI, and the
# agents. The API and the worker are separate processes so a long backfill
# cannot compete with query traffic, and so either can be restarted or scaled
# without the other. The agents only read and post reports.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: candlegraph:latest
  env_file:
    - path: .env
      required: false
  environment: &app-env
    # Always reach Postgres over the compose network, whatever .env says for
    # local runs.
    DB_HOST: postgres
    DB_PORT: "5432"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    # TimescaleDB, not plain PostgreSQL: the three hourly/bar tables are
    # hypertables. Pinned exactly, for the same reason the Dockerfile pins uv.
    # See docs/storage/timescaledb/DESIGN.md.
    image: timescale/timescaledb:2.31.0-pg17
    # The image only writes shared_preload_libraries into postgresql.conf when
    # it runs initdb, i.e. on an empty volume. A volume initialised by the
    # plain postgres image it replaced comes up with the setting empty, and
    # CREATE EXTENSION timescaledb is then a backend FATAL. Passing it on the
    # command line makes the preload a property of the service, not of
    # whichever image happened to create the data directory. See
    # docs/incidents/2026-10-28-stack-would-not-start/POSTMORTEM.md.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: ${DB_NAME:-candlegraph}
      POSTGRES_USER: ${DB_USER:-candlegraph}
      POSTGRES_PASSWORD: ${DB_PASS:-candlegraph}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this, so migrations never race the database.
      #
      # Probe cadence, here and on every service below: fast only while the
      # container is starting (start_interval, inside start_period), then
      # once every three minutes. Compose and depends_on act on health only
      # at start-up, and Docker never restarts an unhealthy container on its
      # own, so a steady-state probe every few seconds bought nothing and
      # cost a process spawn and a query each time. See
      # docs/incidents/2026-10-29-health-probe-cadence/POSTMORTEM.md.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-candlegraph} -d ${DB_NAME:-candlegraph}"]
      interval: 180s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    restart: unless-stopped

  candlegraph:
    <<: *app
    command: ["python", "-m", "candlegraph", "serve"]
    environment:
      <<: *app-env
      # The worker owns ingestion; the API only serves.
      INGEST_ENABLED: "false"
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/status', timeout=5).status == 200 else 1)\""]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 3s

  ui:
    <<: *app
    command: ["python", "-m", "candlegraph", "ui"]
    environment:
      <<: *app-env
      INGEST_ENABLED: "false"
    # Same rule as the worker and the agents: only the API container runs
    # `alembic upgrade head` against a fresh volume. Without this the UI and
    # the API raced on CREATE TABLE alembic_version and one of them crashed
    # on a duplicate-key error in pg_type. See
    # docs/incidents/2026-10-29-health-probe-cadence/POSTMORTEM.md.
    depends_on:
      postgres:
        condition: service_healthy
      candlegraph:
        condition: service_healthy
    ports:
      - "${UI_HOST_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).status == 200 else 1)\""]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 3s

  worker:
    <<: *app
    command: ["python", "-m", "candlegraph", "worker"]
    # Waits for the API to be *healthy*, not merely started: the API's
    # entrypoint is what applies migrations, and two containers running
    # `alembic upgrade head` at once would race on the same DDL.
    depends_on:
      postgres:
        condition: service_healthy
      candlegraph:
        condition: service_healthy

  agents:
    <<: *app
    command: ["python", "-m", "candlegraph", "agents"]
    environment:
      <<: *app-env
      INGEST_ENABLED: "false"
      # The container has no git checkout, so only the observer runs here.
      # The janitor's schedule is .github/workflows/janitor.yml.
      JANITOR_INTERVAL: "0"
    depends_on:
      postgres:
        condition: service_healthy
      candlegraph:
        condition: service_healthy

volumes:
  pgdata:
