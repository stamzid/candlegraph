version: "3.9"

services:
  postgres:
    image: postgres:16.2
    container_name: candlegraph_postgres
    command: postgres -c "max_connections=1024"
    environment:
      SERVICE_NAME: "postgres"
      POSTGRES_DB: "candlegraph"
      POSTGRES_USER: "candlegraph"
      POSTGRES_PASSWORD: "candlegraph"
      POSTGRES_SCHEMA: "candlegraph"
    ports:
      - 5432:5432
    networks:
        - candlegraph
    volumes:
      - ./sql/create_schema.sql:/docker-entrypoint-initdb.d/create_schema.sql

  candlegraph:
    image: candlegraph:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candlegraph
    ports:
      - 8000:8000
    networks:
      - candlegraph
    depends_on:
      - candlegraph_postgres
      - candlegraph_redis

networks:
    candlegraph:
        driver: bridge
