# Project name is intentionally left to Compose's default (the directory name)
# so several checkouts or git worktrees can run side by side. Override with
# COMPOSE_PROJECT_NAME, and the published ports below, if you need two at once.
#
# Five services: the database, the API, the ingest worker, the UI, and the
# agents — plus `ollama`, the embedding model server, behind the `knowledge`
# profile so the default stack stays small. The API and the worker are separate processes so a long backfill
# cannot compete with query traffic, and so either can be restarted or scaled
# without the other. The agents only read and post reports.

x-app: &app
  # Tagged per Compose project, not `latest`. Every worktree used to build
  # into the same `candlegraph:latest`, so a `--build` in one checkout
  # silently retagged the image another checkout's `--force-recreate` then
  # ran. Only the `candlegraph` service carries `build:`; the others use the
  # image it produces. Four services building one tag made buildx bake
  # export it four times at once and fail with "already exists".
  # See docs/incidents/2026-10-29-compose-startup-robustness/.
  image: candlegraph:${COMPOSE_PROJECT_NAME}
  # The image is built locally by `make up`, never pulled; say so when it is
  # missing instead of failing on a Docker Hub lookup.
  pull_policy: never
  env_file:
    - path: .env
      required: false
  environment: &app-env
    # Always reach Postgres over the compose network, whatever .env says for
    # local runs.
    DB_HOST: postgres
    DB_PORT: "5432"
    # Only the API container applies migrations (overridden below for it).
    # The others wait for the API to be healthy, so the schema is at head
    # by the time they start; running `alembic upgrade head` four times was
    # four chances to race on the same DDL.
    RUN_MIGRATIONS: "false"
  depends_on:
    postgres:
      condition: service_healthy
  # Bounded, not `unless-stopped`: a container whose entrypoint fails
  # deterministically (a volume at an unknown revision, say) used to
  # restart forever, `--wait` reported only "unhealthy", and the cause sat
  # in `docker compose logs`. Five attempts, then it stays exited and
  # `make up` prints its log. A healthy run of ten seconds resets the count,
  # so a crash later in life is still restarted.
  restart: on-failure:5

services:
  postgres:
    # TimescaleDB, not plain PostgreSQL: the three hourly/bar tables are
    # hypertables. The -ha flavour (Ubuntu) also carries pgvector and
    # pgvectorscale for stage 1; the Alpine image does not. Pinned exactly,
    # for the same reason the Dockerfile pins uv, and in CI and the
    # testcontainer too. See docs/storage/timescaledb/DESIGN.md and
    # docs/storage/pgvector-coexistence/DESIGN.md.
    image: timescale/timescaledb-ha:pg17.11-ts2.31.0
    # The image only writes shared_preload_libraries into postgresql.conf when
    # it runs initdb, i.e. on an empty volume. A volume initialised by the
    # plain postgres image it replaced comes up with the setting empty, and
    # CREATE EXTENSION timescaledb is then a backend FATAL. Passing it on the
    # command line makes the preload a property of the service, not of
    # whichever image happened to create the data directory. See
    # docs/incidents/2026-10-28-stack-would-not-start/POSTMORTEM.md.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: ${DB_NAME:-candlegraph}
      POSTGRES_USER: ${DB_USER:-candlegraph}
      POSTGRES_PASSWORD: ${DB_PASS:-candlegraph}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # The -ha image keeps PGDATA under /home/postgres, not /var/lib/postgresql.
      # Mounting the old path would leave the data directory on the container
      # layer and lose it on recreate.
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      # The app waits for this, so migrations never race the database.
      # Over TCP on purpose: during initdb the image runs a temporary server
      # that listens only on the Unix socket, and `pg_isready` with no host
      # would report it "accepting connections" moments before it is shut
      # down again. -h 127.0.0.1 can only succeed against the real server.
      #
      # Probe cadence, here and on every service below: fast only while the
      # container is starting (start_interval, inside start_period), then
      # once every three minutes. Compose and depends_on act on health only
      # at start-up, and Docker never restarts an unhealthy container on its
      # own, so a steady-state probe every few seconds bought nothing and
      # cost a process spawn and a query each time. See
      # docs/incidents/2026-10-29-health-probe-cadence/POSTMORTEM.md.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-candlegraph} -d ${DB_NAME:-candlegraph}"]
      interval: 180s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    restart: unless-stopped

  candlegraph:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    command: ["python", "-m", "candlegraph", "serve"]
    environment:
      <<: *app-env
      # The worker owns ingestion; the API only serves.
      INGEST_ENABLED: "false"
      # The one container that applies migrations.
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/status', timeout=5).status == 200 else 1)\""]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 3s

  ui:
    <<: *app
    command: ["python", "-m", "candlegraph", "ui"]
    environment:
      <<: *app-env
      INGEST_ENABLED: "false"
    # Same rule as the worker and the agents: only the API container runs
    # `alembic upgrade head` against a fresh volume. Without this the UI and
    # the API raced on CREATE TABLE alembic_version and one of them crashed
    # on a duplicate-key error in pg_type. See
    # docs/incidents/2026-10-29-health-probe-cadence/POSTMORTEM.md.
    depends_on:
      postgres:
        condition: service_healthy
      candlegraph:
        condition: service_healthy
    ports:
      - "${UI_HOST_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).status == 200 else 1)\""]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 3s

  worker:
    <<: *app
    command: ["python", "-m", "candlegraph", "worker"]
    # Waits for the API to be *healthy*, not merely started: the API's
    # entrypoint is what applies migrations, and two containers running
    # `alembic upgrade head` at once would race on the same DDL.
    depends_on:
      postgres:
        condition: service_healthy
      candlegraph:
        condition: service_healthy

  agents:
    <<: *app
    command: ["python", "-m", "candlegraph", "agents"]
    environment:
      <<: *app-env
      INGEST_ENABLED: "false"
      # The container has no git checkout, so only the observer runs here.
      # The janitor's schedule is .github/workflows/janitor.yml.
      JANITOR_INTERVAL: "0"
    depends_on:
      postgres:
        condition: service_healthy
      candlegraph:
        condition: service_healthy

  ollama:
    # The local embedding model server (docs/knowledge/embeddings/DESIGN.md).
    # Behind a profile: `make up` does not pull a gigabyte of weights for a
    # stack that is only ingesting; `make up-knowledge` does. Pinned exactly,
    # like every other image here. The app containers reach it as
    # http://ollama:11434 (OLLAMA_URL); the host port is for local runs.
    profiles: ["knowledge"]
    image: ollama/ollama:0.40.13
    entrypoint: ["/bin/sh", "-c"]
    # Serve, wait until the API answers, pull the configured model once
    # (a no-op when the volume already has it), then stay in the foreground.
    command:
      - >-
        ollama serve & pid=$$!;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "${EMBEDDING_MODEL:-bge-m3}";
        wait $$pid
    environment:
      # Keep the model resident between batches instead of reloading it.
      OLLAMA_KEEP_ALIVE: "24h"
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # Healthy means "the model is pulled", not merely "the server is up":
      # `depends_on` and `--wait` should hold until an embed call can succeed.
      # start_period covers a cold pull on a slow link; afterwards the usual
      # once-every-three-minutes cadence (invariant 25).
      test: ["CMD-SHELL", "ollama show \"${EMBEDDING_MODEL:-bge-m3}\" >/dev/null 2>&1"]
      interval: 180s
      timeout: 15s
      retries: 3
      start_period: 900s
      start_interval: 5s
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
