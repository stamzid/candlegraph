name: Janitor

# The CI janitor's schedule. It runs the repository's own checks, applies the
# mechanical fixes (formatting, lint --fix), re-checks, and opens a draft PR
# when something changed. It never merges. Run it by hand with
# workflow_dispatch to see a report without waiting for the cron.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a draft PR when fixes changed files"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: janitor
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.19"

jobs:
  janitor:
    name: Run checks, fix, draft PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default token cannot trigger CI on the PR it opens; a PAT in
          # JANITOR_TOKEN fixes that. Falls back to the default token.
          token: ${{ secrets.JANITOR_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups --extra ui

      - name: Identify the janitor
        run: |
          git config user.name "candlegraph janitor"
          git config user.email "janitor@users.noreply.github.com"

      - name: Run the janitor
        env:
          GH_TOKEN: ${{ secrets.JANITOR_TOKEN || github.token }}
          JANITOR_OPEN_PR: ${{ github.event_name == 'schedule' && 'true' || inputs.open_pr }}
          JANITOR_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          # No database in this job: log and file sinks only.
          AGENT_REPORT_SINKS: log,file
          AGENT_REPORT_DIR: reports
        run: make janitor ARGS="--strict"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janitor-report
          path: reports/
          if-no-files-found: ignore
