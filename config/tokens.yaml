# Tokens candlegraph ingests. Addresses are Ethereum mainnet ERC-20 contracts
# as indexed by the Uniswap v3 subgraph, and must be lowercase.
#
# `symbol` is the name the GraphQL API is queried by and must be unique.
# `name` is informational only; authoritative metadata comes from the subgraph.
# `aliases` are the names a document might use for the token — the knowledge
# layer's entity-linking dictionary, loaded into the `asset` table by
# `candlegraph knowledge sync-assets` (make sync-assets). Each alias must be
# unique across the whole file; a token without any gets [symbol, name].
#
# Adding one is a config change, not a code change: see
# .claude/skills/add-token/SKILL.md for how to verify it actually ingests.
tokens:
  - address: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
    symbol: WETH
    name: Wrapped Ether
    aliases: [WETH, Wrapped Ether, Ether, Ethereum, ETH]
